changelog:
  exclude:
    labels:
      - skip-release-notes
      - release
      - duplicate
      - invalid
      - wontfix
    authors:
      - github-actions[bot]
      - dependabot[bot]
  categories:
    - title: "Features"
      labels:
        - feat
        - feature
        - enhancement
    - title: "Fixes"
      labels:
        - fix
        - bug
        - bugfix
    - title: "Documentation"
      labels:
        - docs
        - documentation
    - title: "Maintenance"
      labels:
        - chore
        - ci
        - refactor
        - test
        - build
    - title: "Other Changes"
      labels:
        - "*"
