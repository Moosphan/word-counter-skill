name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Sync runtime into skill packages
        run: python3 scripts/sync_skill_runtime.py

      - name: Run realistic smoke tests
        run: python3 scripts/smoke_test_skills.py

      - name: Build release archives
        run: python3 scripts/package_skills.py --version ci --clean
